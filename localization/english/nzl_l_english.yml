  # Discrimination traits
  nzl_tradition_waitangi: "Treaty of Waitangi"

  # Decisions
  nzl_secure_sovereignty_decision: "Secure Sovereignty over $geographic_region_new_zealand$"
  nzl_secure_sovereignty_decision_desc: "The growing number of $GBR_ADJ$ settlers in $geographic_region_new_zealand$ calls for the establishment of a separate Government that can treat with the local [GetCulture('maori').GetNameNoFormatting] chiefs."

  # GBR event
  nzl.1.t: "The Treaty of Waitangi"
  nzl.1.d: "With the separation of the $concept_colony_subject$ of [SCOPE.sCountry('nzl_colony').GetName] from [SCOPE.sCountry('nzl_subject').GetName], it now falls to [SCOPE.sCountry('nzl_colony').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('nzl_colony').GetRuler.GetFullName] to treat with [SCOPE.sCountry('nzl_target').GetName] and obtain their recognition of [SCOPE.sCountry('nzl_overlord').GetRuler.GetHerHis|U] Majesty's sovereign authority over $geographic_region_new_zealand$."
  nzl.1.f: "\"The [SCOPE.sCountry('nzl_overlord').GetRuler.GetCustom('getQueenKing')], in common with [SCOPE.sCountry('nzl_overlord').GetRuler.GetHerHis|U] Majesty's predecessor, disclaims for [SCOPE.sCountry('nzl_overlord').GetRuler.GetHerselfHimself] and [SCOPE.sCountry('nzl_overlord').GetRuler.GetHerHis|U] subjects every pretension to seize on the Islands of $geographic_region_new_zealand$, or to govern them as a part of the Dominions of [SCOPE.sCountry('nzl_overlord').GetNameNoFormatting] unless the free intelligent consent of the natives, expressed according to their established usages, shall first be obtained.\"" # Lord Normanby's instructions to William Hobson.
  nzl.1.a: "Their own welfare would be best promoted by their surrender to [SCOPE.sCountry('nzl_overlord').GetRuler.GetHerHis|U] Majesty." # Lord Normanby's instructions to William Hobson.
  nzl.1.b: "The necessity for the interposition of Government has become too evident to admit to any further inaction." # Lord Normanby's instructions to William Hobson.

  # UNT event
  nzl.2.t: "Te Tiriti o Waitangi"
  nzl.2.d: "The continued flow of [SCOPE.sCountry('nzl_overlord').GetAdjectiveNoFormatting] settlers into $geographic_region_new_zealand$ has compelled [SCOPE.sCountry('nzl_overlord').GetName] to assert its authority in the region. To those ends they have sent [SCOPE.sCountry('nzl_colony').GetRuler.GetFullName] to propose a covenant with our people; recognize [SCOPE.sCountry('nzl_overlord').GetAdjectiveNoFormatting] governorship and receive their protection from foreign powers."
  nzl.2.f: "\"This is [SCOPE.sCountry('nzl_overlord').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('nzl_overlord').GetRuler.GetFirstNameNoFormatting]'s act of love to you. [SCOPE.sCountry('nzl_overlord').GetRuler.GetSheHe|U] wants to ensure you that you keep what is yours — your property, your rights and privileges, and those things you value. Who knows when a foreign power, perhaps the [SCOPE.sCulture('nzl_rival_culture').GetCustom('getPluralDemonym')], might try to take this country? The treaty is really like a fortress to you.\"" # Reverend Williams at the signing of the treaty.
  nzl.2.a: "I sign this not with my hand, but with the mana of my ancestors." # Hōne Heke of the Ngāpuhi.
  nzl.2.b: "The [SCOPE.sCulture('nzl_target_culture').GetNameNoFormatting] people don't want a governor!" # Rewa of the Ngāi Tawake.

  # NSW event
  nzl.3.t: "The Colony of New Zealand"
  nzl.3.d: "The continued flow of [SCOPE.sCountry('nzl_overlord').GetAdjectiveNoFormatting] settlers into $geographic_region_new_zealand$ has compelled [SCOPE.sCountry('nzl_overlord').GetName] to establish [SCOPE.sCountry('nzl_colony').GetName] as a separate colony. Our former territory there will now be administered by its own government."
  nzl.3.f: "\"I have received information, that [SCOPE.sCountry('nzl_overlord').GetRuler.GetHerHis|U] Majesty has been pleased to erect the Islands of $geographic_region_new_zealand$ into a separate Government; and that consequently the intimate connexion which existed for a time between $geographic_region_new_zealand$ and [ROOT.GetCountry.GetNameNoFormatting] has ceased; a friendly intercourse, however, and one of mutual benefits, will continue, I trust, still to be kept up between the two Countries; and there is not, I am sure, an Inhabitant of $geographic_region_new_zealand$ who will not join with me in wishing success to the Colonists of [SCOPE.sCountry('nzl_colony').GetNameNoFormatting].\"" # George Gipps' address to the Legislative Council.
  nzl.3.a: "We will not inspect them too narrowly." # Robert Peel in a House of Commons debate on New Zealand, quoting Edmund Burke regarding the North American colonies.
  nzl.3.b: "Onward." # New Zealand Coat of Arms 1911–1956.

  # Notifications
  notification_nzl_treaty_of_waitangi_rejected_name: "Treaty of Waitangi Rejected"
  notification_nzl_treaty_of_waitangi_rejected_desc: "The [GetCulture('maori').GetNameNoFormatting] chiefs of [SCOPE.sCountry('nzl_target').GetName] have refused to sign the Treaty of Waitangi and join [SCOPE.sCountry('nzl_colony').GetName], damaging our [concept_relations]."
  notification_nzl_treaty_of_waitangi_rejected_tooltip: "#header $notification_nzl_treaty_of_waitangi_rejected_name$#!\n$TOOLTIP_DELIMITER$\n$notification_nzl_treaty_of_waitangi_rejected_tooltip$"

  # Law amendments
  nzl_amendment_treaty_of_waitangi: "Treaty of Waitangi"
  nzl_amendment_treaty_of_waitangi_desc: "Representatives of the Crown have promised the [GetCulture('maori').GetNameNoFormatting] the full rights and privileges all $GBR_ADJ$ subjects are entitled to."

  # Historical treaties
  nzl_treaty_name_he_whakaputanga: "He Whakaputanga" # Declaration of the Independence of New Zealand.
